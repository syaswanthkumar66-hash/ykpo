<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | YK Yash</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #2b3a30; /* Matches your 'sage' theme color */
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 8rem;
      margin: 0;
      color: #c5d86d; /* Matches your 'olive' theme color */
      line-height: 1;
    }
    h2 {
      font-size: 2.5rem;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }
    p {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 2.5rem;
      max-width: 500px;
    }
    a {
      padding: 14px 28px;
      background-color: #c5d86d;
      color: #2b3a30;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      transition: opacity 0.2s, transform 0.2s;
    }
    a:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>Oops! The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
  <a href="/">Return to Homepage</a>
</body>
</html>
